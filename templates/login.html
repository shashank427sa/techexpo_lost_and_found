{% extends "base.html" %}{% block title %}Login · Fast Find AI{% endblock %}
{% block content %}
<div class="form-card"><h1>Welcome back</h1><p class="muted">Log in to manage your reports.</p>
<form method="post">
<label>Email<input type="email" name="email" required autocomplete="email"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button class="button full">Log in</button>
</form><p class="muted">New here? <a href="{{ url_for('register') }}">Create account</a></p></div>
{% endblock %}
